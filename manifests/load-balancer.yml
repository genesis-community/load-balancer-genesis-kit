---
meta:
  default:
    azs: [z1]

# The load balancer list is read from params.load_balancers, or from
# params.load-balancers when only that older spelling is set.  Neither is
# declared here with (( param )), because requiring one spelling would
# reject an environment that sets the other.  The check hook reports a
# missing list.
instance_groups:
  - name:      lb
    instances: (( grab params.instances || 2 ))
    azs:       (( grab params.availability_zones || meta.default.azs ))
    stemcell:  default
    vm_resources:
      cpu: (( grab params.cpu || 2 ))
      ram: (( grab params.ram || 2048 ))
      ephemeral_disk_size: (( grab params.disk || 16384 ))
    networks:
      - name: (( grab params.network || "default" ))

    jobs:
      - name: haproxy
        release: load-balancer
        properties:
          load-balancers: (( grab params.load_balancers || params.load-balancers ))

update:
  serial:            false
  canaries:          1
  max_in_flight:     1
  max_errors:        1
  canary_watch_time: 5000-600000
  update_watch_time: 5000-600000

stemcells:
  - alias:   default
    os:      (( grab params.stemcell_os      || "ubuntu-xenial" ))
    version: (( grab params.stemcell_version || "latest" ))
